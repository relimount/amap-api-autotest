# 地理编码接口（v3/geocode/geo）用例集
#
# 字段说明
#   case      用例名，会作为 pytest 的用例 ID 显示在报告里
#   path      接口路径，拼在 BASE_URL 后面
#   params    直接映射为 URL 查询参数，key 由框架统一注入，这里不用写
#   expect    期望结果，由断言解释器逐条校验
#     http_status  HTTP 状态码
#     body         响应体字段的精确匹配
#     has_keys     必须存在的字段
#     not_has_keys 必须不存在的字段

cases:
  - case: 正向-详细地址
    params:
      address: 北京市朝阳区阜通东大街6号
    expect:
      http_status: 200
      body: {status: "1", infocode: "10000"}
      has_keys: [geocodes, count]
      types: {count: str, geocodes: list}

  - case: 缺少必填参数address
    params: {}
    expect:
      http_status: 200
      body: {status: "0", infocode: "20001"}

  - case: address为空串
    params:
      address: ""
    expect:
      http_status: 200
      body: {status: "0"}

  - case: address为不存在的地名
    params:
      address: 这不是一个地名
    expect:
      http_status: 200
      body: {status: "0", infocode: "30001"}
      not_has_keys: [geocodes, count]

  - case: 选填参数city限定城市
    params:
      address: 人民路
      city: 成都
    expect:
      http_status: 200
      body: {status: "1"}

  - case: 选填参数city传空串
    params:
      address: 人民路
      city: ""
    expect:
      http_status: 200
      body: {status: "1"}
