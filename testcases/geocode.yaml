# 地理编码接口（v3/geocode/geo）用例集
#
# 字段说明
#   case      用例名，会作为 pytest 的用例 ID 显示在报告里
#   params    直接映射为 URL 查询参数；key 由 api 层统一注入，这里不用写
#   expect    期望结果，由断言解释器逐条校验
#     http_status  HTTP 状态码
#     body         字段精确匹配。路径用点号分层，列表下标也算一层：geocodes.0.adcode
#     has_keys     必须存在的字段
#     not_has_keys 必须不存在的字段（错误分支用它确认没混入数据字段）
#     types        字段类型，取值见 assert_util.TYPE_MAP

cases:
  - case: 正向-详细地址
    params:
      address: 北京市朝阳区阜通东大街6号
    expect:
      http_status: 200
      body:
        status: "1"
        infocode: "10000"
        "geocodes.0.adcode": "110105"
        "geocodes.0.level": "门址"
        "geocodes.0.street": "阜通东大街"
      has_keys:
        - geocodes
        - count
        - "geocodes.0.formatted_address"
        - "geocodes.0.province"
        - "geocodes.0.city"
        - "geocodes.0.citycode"
        - "geocodes.0.district"
        - "geocodes.0.number"
      types:
        count: str
        geocodes: list

  - case: 正向-简略地址
    params:
      address: 阜通东大街6号
    expect:
      http_status: 200
      body:
        status: "1"
        infocode: "10000"
        "geocodes.0.adcode": "110105"
      has_keys:
        - geocodes
        - count
        - "geocodes.0.formatted_address"
        - "geocodes.0.province"
        - "geocodes.0.city"
        - "geocodes.0.street"
      types:
        count: str
        geocodes: list

  - case: 缺少key
    params:
      key: null
      address: 北京市朝阳区阜通东大街6号
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "10001"
      not_has_keys:
        - geocodes
        - count

  - case: key为空串
    params:
      key: ""
      address: 北京市朝阳区阜通东大街6号
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "10001"
      not_has_keys:
        - geocodes
        - count

  - case: 错误key
    params:
      key: 1234567890abcdef1234567890abcdef
      address: 北京市朝阳区阜通东大街6号
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "10001"
      not_has_keys:
        - geocodes
        - count

  - case: 缺少address
    params: {}
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "20001"
      not_has_keys:
        - geocodes
        - count

  - case: address为空串
    params:
      address: ""
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "20000"
      not_has_keys:
        - geocodes
        - count

  - case: address为空格
    params:
      address: " "
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "20000"
      not_has_keys:
        - geocodes
        - count

  - case: address不存在
    params:
      address: 这不是一个地名
    expect:
      http_status: 200
      body:
        status: "0"
        infocode: "30001"
      not_has_keys:
        - geocodes
        - count

  - case: 正向-省级
    params:
      address: 湖南省
    expect:
      http_status: 200
      body:
        status: "1"
        infocode: "10000"
        "geocodes.0.adcode": "430000"
        "geocodes.0.level": "省"
      has_keys:
        - geocodes
        - count
        - "geocodes.0.province"
        - "geocodes.0.formatted_address"
      types:
        count: str
        geocodes: list

  - case: 正向-区县级
    params:
      address: 温江区
    expect:
      http_status: 200
      body:
        status: "1"
        infocode: "10000"
        "geocodes.0.adcode": "510115"
        "geocodes.0.level": "区县"
        "geocodes.0.district": "温江区"
      has_keys:
        - geocodes
        - count
        - "geocodes.0.province"
        - "geocodes.0.city"
        - "geocodes.0.citycode"
        - "geocodes.0.formatted_address"
      types:
        count: str
        geocodes: list

  - case: city限定生效
    params:
      address: 人民路
      city: 成都
    expect:
      http_status: 200
      body:
        status: "1"
        infocode: "10000"
        "geocodes.0.city": "成都市"
        "geocodes.0.citycode": "028"
      has_keys:
        - geocodes
        - count
        - "geocodes.0.adcode"
        - "geocodes.0.district"
      types:
        count: str
        geocodes: list
